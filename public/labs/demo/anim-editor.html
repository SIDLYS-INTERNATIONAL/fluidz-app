<!DOCTYPE html>
<html lang="en">

/* Search editor, 9 s loop. Colours and layout from pns-demo.html; 800x600, scaled to fit. */
:root{--m:rgba(237,232,245,.56);--d:rgba(237,232,245,.32);--b:rgba(255,255,255,.09);--c:#E0887A}

.btns{display:flex;gap:6px}.btns i,.oh .back,.lab .x,.go{display:flex;align-items:center;justify-content:center}.btns i{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.04);color:var(--m)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#body{position:absolute;left:22px;right:22px;top:66px;display:flex;flex-direction:column;gap:10px}
.oh{display:flex;align-items:center;gap:12px;height:42px}.oh .back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--m)}.oh b{font-size:22px;font-weight:700}
.hint{font-size:15px;color:var(--m);line-height:1.4}
.crit{border:1px solid var(--b);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.025)}
.lab{display:flex;align-items:center;gap:8px}
.field{flex:1;height:42px;background:#1D1B2E;border:1px solid rgba(224,136,122,.28);border-radius:12px;padding:0 14px;display:flex;align-items:center;font-size:17px;font-weight:700}
.lab .x{width:34px;height:34px;color:rgba(237,232,245,.4)}

.chip .xx{width:12px;height:12px;opacity:.75}
.chip.no{background:rgba(226,96,96,.13);color:#E98080}
.chip .eq{display:none;width:20px;height:20px;border-radius:6px;background:#E0887A;color:#14090A;font-size:13px;font-weight:800;align-items:center;justify-content:center;margin:0 -2px 0 -5px}
.chip u{text-decoration:none}.chip.eq .eq{display:inline-flex}.chip.eq u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.slot{height:38px;padding:0 15px;border-radius:999px;border:1px dashed rgba(255,255,255,.2);color:var(--d);font-size:16px;font-weight:600;display:inline-flex;align-items:center;min-width:104px}
.slot.ty{color:#EDE8F5;border-color:rgba(224,136,122,.5)}
.caret{display:inline-block;width:1.5px;height:17px;background:#E0887A;vertical-align:middle}
.sep{display:flex;align-items:center;gap:14px;height:22px}.sep i{flex:1;height:1px;background:var(--b)}.sep span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--d)}

.pv{display:flex;align-items:center;gap:10px;height:22px;white-space:nowrap}

.lines{font-size:15px;color:var(--m);font-weight:600}.lines .tm{color:#E0887A;font-weight:700}

#cur svg{width:26px;height:26px;fill:#fff;stroke:#111;stroke-width:1.5}

  </div>

  <div id="cur"><svg viewBox="0 0 24 24"><path d="M4 3l16 7-7 2-3 7z"/></svg></div>
</div>
