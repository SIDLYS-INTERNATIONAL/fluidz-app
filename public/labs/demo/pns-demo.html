/* A faithful, lighter copy of the 3.0 panel (same colours and layout as the extension's ui-css.js). No video: CSS + a small script. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0b10;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#EDE8F5;-webkit-font-smoothing:antialiased}
#cam{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#100f14}
#grid{position:absolute;left:0;top:0;width:620px;height:540px;overflow:hidden}
#track{position:absolute;left:10px;top:0;width:600px;display:grid;grid-template-columns:repeat(4,150px);will-change:transform}
.pf{position:relative;height:180px;padding:4px}
.pf .im{position:absolute;inset:4px;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,var(--a),var(--b));transition:opacity .3s,filter .3s}
.pf .im::before{content:'';position:absolute;left:50%;top:26%;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:rgba(255,255,255,.5)}
.pf .im::after{content:'';position:absolute;left:50%;top:58%;width:96px;height:90px;margin-left:-48px;border-radius:48px 48px 0 0;background:rgba(255,255,255,.5)}
.pf .nm{position:absolute;left:12px;bottom:12px;z-index:2;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf .st{position:absolute;right:12px;top:10px;z-index:2;width:14px;height:14px;fill:#f5c518;display:none}
.pf.fav .st{display:block}
.dim .pf:not(.hit) .im{opacity:.14;filter:grayscale(1)}
.pf.hit .im{outline:2px solid rgba(224,136,122,.9);outline-offset:-2px}
.pf.pulse .im{box-shadow:0 0 0 6px rgba(224,136,122,.55)}
#badge{position:absolute;left:18px;top:14px;z-index:5;font-size:10px;font-weight:700;letter-spacing:1px;color:#E0887A;background:rgba(12,11,16,.82);border:1px solid rgba(224,136,122,.3);border-radius:999px;padding:5px 11px}
/* panel */
#dock{position:absolute;right:16px;top:12px;width:324px;display:flex;flex-direction:column;gap:7px}
.card,.panel{background:rgba(13,12,22,.97);border:1px solid rgba(255,255,255,.09);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel{padding:10px;display:flex;flex-direction:column;gap:7px}
.hd{display:flex;align-items:center;justify-content:space-between;height:28px}

.brand b{display:block;font-size:13px;font-weight:700;line-height:1.1}.brand small{display:block;font-size:9.5px;font-weight:600;color:rgba(237,232,245,.32)}
.btns{display:flex;gap:4px}.btns i{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:rgba(237,232,245,.56)}
.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.blk{border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.blk.on{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.09)}
.bh{display:flex;align-items:center;gap:7px;padding:8px 9px;min-height:36px}
.bh .n{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.07);color:rgba(237,232,245,.56);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.blk.on .bh .n{background:#E0887A;color:#14090A}
.bh .t{font-size:12.5px;font-weight:700}
.bh .s{flex:1;min-width:0;font-size:10.5px;font-weight:600;color:rgba(237,232,245,.32);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.bh .s.hot{color:#E0887A}.bh .s .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6BA888;margin-right:4px;vertical-align:middle}
.bh .chev{color:rgba(237,232,245,.32);transition:transform .15s}.blk.on .bh .chev{transform:rotate(90deg)}
.bb{padding:0 9px 9px;display:none;flex-direction:column;gap:7px}.blk.on .bb{display:flex}
.field{min-height:36px;background:#1D1B2E;border:1px solid rgba(224,136,122,.28);border-radius:11px;padding:0 6px 0 10px;display:flex;align-items:center;gap:4px;font-size:12px}
.field .v{flex:1;white-space:nowrap;overflow:hidden}.field .ph{color:rgba(237,232,245,.32)}
.caret{display:inline-block;width:1.5px;height:14px;background:#E0887A;vertical-align:middle;margin-left:1px}
.field .q{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.09);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:rgba(237,232,245,.56)}
.act{border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:7px 9px;display:flex;flex-direction:column;gap:4px}
.act .top{display:flex;justify-content:space-between;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:rgba(237,232,245,.32)}
.act .top span+span{font-size:10.5px;letter-spacing:0;text-transform:none;color:#E0887A}
.lines{font-size:11px;line-height:1.45;color:rgba(237,232,245,.56)}.lines .tm{color:#E0887A;font-weight:700}
.lines .c{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(237,232,245,.32);margin:0 4px}
.links{display:flex;gap:5px}.lk{border-radius:999px;padding:5px 9px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.05);color:rgba(237,232,245,.56);white-space:nowrap}
.go{height:34px;border-radius:11px;background:#E0887A;color:#14090A;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}
.go.stop{background:#1D1B2E;color:#E0887A}
.stats{display:flex;gap:5px}.stat{flex:1;border-radius:9px;background:rgba(255,255,255,.03);padding:6px 7px}
.stat b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}.stat small{display:block;font-size:9.5px;color:rgba(237,232,245,.56);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:rgba(237,232,245,.32)}
.ftabs{display:flex;gap:3px;padding:3px;border-radius:11px;background:rgba(255,255,255,.04)}
.ftabs span{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;padding:5px 4px;font-size:10.5px;font-weight:800;color:rgba(237,232,245,.56);white-space:nowrap}
.ftabs span.on{background:#E0887A;color:#14090A}.ftabs i{font-style:normal;font-size:9.5px;opacity:.75}
.res{display:flex;flex-direction:column;gap:4px}
.r{display:flex;align-items:center;gap:8px;border-radius:11px;padding:6px 7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.r.on{background:rgba(224,136,122,.12);border-color:rgba(224,136,122,.28)}
.av{width:28px;height:28px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--a),var(--b))}

.r .tx small{display:block;font-size:9.5px;color:rgba(237,232,245,.32)}

.card .na{display:flex;flex-direction:column;gap:4px}.card .na span{border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.07);text-align:center}

.adv{font-size:11px;font-weight:700;color:rgba(237,232,245,.56);padding:2px 2px 0;display:flex;align-items:center;gap:5px}

#cur{position:absolute;z-index:20;left:0;top:0;width:22px;height:22px;opacity:0;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}

    if (t < 10.4) return lerp(4.4, 0, ease((t - 9.7) / 0.7))

  }
  function lines() {

    return tm('jay') + c('orElse') + tm('mike') + c('orElse') + tm('TOP') + c('andAlso') + tm('XXL')
  }
  function row(i, on, past) {

    return '<div class="r' + (on ? ' on' : '') + '" data-i="' + i + '"><span class="av" style="--a:' + COLORS[i % 6] + ';--b:' + COLORS[(i + 2) % 6] + '"></span><span class="tx"><b>' + star + f[0].replace(/</g, '') + '</b><small>' + (past ? T('pastBack') : T('onScreen')) + '</small></span><span class="sh">' + T('noteShow') + ' <svg class="ic" style="width:11px;height:11px"><use href="/labs/icons.svg#locate-fixed"/></svg></span></div>'
  }
  var last = ''
  window.setT = function (t) {

    var visRows = (t >= 7 ? 4.4 : off) + 540 / ROWH, seen = t < 2.6 ? 0 : Math.min(N, Math.floor((visRows + 0.2) * COLS)), found = []
    var nonTab = t >= 11.6
    cards.forEach(function (c, i) { var hit = t >= 2.6 && FIX[i] && i < seen; if (hit) found.push(i); c.classList.toggle('hit', !!hit && !(nonTab && FIX[i][1])); c.classList.toggle('pulse', i === 6 && t >= 10.4 && t < 11.2) })
    var favs = found.filter(function (i) { return FIX[i][1] }).length
    var block = t < 2.6 ? 1 : (t < 7 ? 2 : 3)
    ;['b1', 'b2', 'b3'].forEach(function (id, k) { $(id).classList.toggle('on', block === k + 1) })
    // ① typing, then the active search

    $('field').innerHTML = n ? TYPED.slice(0, n).replace(/</g, '') + (t < 2.6 ? '<span class="caret"></span>' : '') : '<span class="ph">' + T('ph') + '</span><span class="caret"></span>'
    $('act').style.display = n >= TYPED.length ? '' : 'none'
    $('lines').innerHTML = lines()
    $('mys').textContent = T('mySearches', { n: 4 })
    $('s1').textContent = t >= 2.6 ? 'jay | mike | TOP + XXL' : ''; $('s1').className = 's' + (t >= 2.6 ? ' hot' : '')
    // ② scan
    var scanned = t < 2.6 ? 0 : Math.round(seen * 26.5)
    $('s2').innerHTML = scanning ? '<span class="dot"></span>' + T('scanning') + ' · ' + scanned : (t >= 7 ? T('nScanned', { n: scanned }) : T('b2idle'))
    $('s2').className = 's' + (scanning ? ' hot' : '')
    $('g1').textContent = scanned; $('g2').textContent = found.length; $('g3').textContent = favs
    $('meta').textContent = T('speedGentle') + ' · ' + T('metaPause') + ' · ' + T('metaCap', { m: 30 })
    // ③ results, tabs All / Favorites / Not favorites

    $('s3').textContent = found.length ? T('nFound', { n: found.length }) : T('b3idle'); $('s3').className = 's' + (found.length ? ' hot' : '')
    $('tA').className = non ? '' : 'on'; $('tN').className = non ? 'on' : ''; $('tF').className = ''
    $('tA').querySelector('i').textContent = found.length; $('tF').querySelector('i').textContent = favs; $('tN').querySelector('i').textContent = found.length - favs
    var cur = t >= 10.2 && t < 11.6 ? 6 : -1, key = list.join() + '|' + cur + '|' + Math.round(off * 2)
    if (key !== last) { last = key; $('res').innerHTML = list.slice(0, 5).map(function (i) { return row(i, i === cur, Math.floor(i / COLS) < off - 0.6 || Math.floor(i / COLS) >= off + 2.9) }).join('') }
    // pause on a match
    var note = t >= 7 && t < 9.4
    $('note').style.display = note ? 'flex' : 'none'; $('noteT').textContent = T('noteTitle', { name: 'Mike 🚀' })
    // cursor: Show on "Mike 🚀" (9.0-10.2), then the Not favorites tab (11.0-11.6)
    var c = $('cur'), o = 0, x = 0, y = 0
    var target = function (el) { if (!el) return [700, 400]; var a = el.getBoundingClientRect(), cam = $('cam').getBoundingClientRect(), k = cam.width / 960; return [(a.left - cam.left) / k + a.width / k * 0.55, (a.top - cam.top) / k + a.height / k * 0.5] }
    if (t >= 9 && t < 12.4) {
      var sh = document.querySelector('#res .r[data-i="6"] .sh') || document.querySelector('#res .r .sh'), p1 = target(sh), p2 = target($('tN'))
      if (t < 9.9) { var k1 = ease((t - 9) / 0.9); x = lerp(560, p1[0], k1); y = lerp(470, p1[1], k1) }
      else if (t < 11) { var k2 = ease((t - 10.3) / 0.7); x = lerp(p1[0], p2[0], k2); y = lerp(p1[1], p2[1], k2) }
      else { x = p2[0]; y = p2[1] }
      o = t > 12 ? 1 - (t - 12) / 0.4 : 1
      c.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + ((t > 9.95 && t < 10.1) || (t > 11.45 && t < 11.6) ? 0.82 : 1) + ')'
    }
    c.style.opacity = o
  }
  function fit() { var k = Math.min(innerWidth / 960, innerHeight / 540), cam = $('cam'); cam.style.transform = 'scale(' + k + ')'; cam.style.left = (innerWidth - 960 * k) / 2 + 'px'; cam.style.top = (innerHeight - 540 * k) / 2 + 'px' }
  addEventListener('resize', fit); fit()
  var q = new URLSearchParams(location.search), reduce = false
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches } catch (e) {}
  // Readable without interaction: a still frame with results when asked (?t=) or when the visitor prefers less motion.
  if (q.has('t')) setT(+q.get('t')); else if (reduce || q.has('static')) setT(8); else { setT(0); var t0 = performance.now(); (function tick(now) { setT((now - t0) / 1000); requestAnimationFrame(tick) })(t0) }
})()
