<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Name Search 3.0 - auto-scroll scan</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Auto-scroll scan, 10 s loop. Colours and layout from pns-demo.html; 800x600, scaled to fit. */
:root{--m:rgba(237,232,245,.56);--d:rgba(237,232,245,.32);--b:rgba(255,255,255,.09);--c:#E0887A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0b10;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#EDE8F5}
#cam{position:absolute;left:0;top:0;width:800px;height:600px;transform-origin:0 0;overflow:hidden;background:#100f14}
#grid{position:absolute;inset:0;overflow:hidden}
#track{position:absolute;left:0;top:0;width:800px;display:grid;grid-template-columns:repeat(4,200px)}
.pf{position:relative;height:180px}
.pf .im{position:absolute;inset:4px;border-radius:12px;overflow:hidden;background:#1a1820 center/cover no-repeat}
.pf .nm{position:absolute;left:14px;bottom:13px;z-index:2;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap}
.pf .st{position:absolute;right:14px;top:12px;z-index:2;width:16px;height:16px;fill:#f5c518}
.dim .pf:not(.hit) .im{opacity:.14;filter:grayscale(1)}
.pf.hit .im{outline:3px solid rgba(224,136,122,.9);outline-offset:-3px}
.pf.pulse .im{box-shadow:0 0 0 7px rgba(224,136,122,.55)}
#badge{position:absolute;left:20px;top:16px;z-index:5;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--c);background:rgba(12,11,16,.82);border:1px solid rgba(224,136,122,.3);border-radius:999px;padding:6px 13px}
#dock{position:absolute;right:18px;top:104px;width:336px}
.card,.panel{background:rgba(13,12,22,.97);border:1px solid var(--b);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel{padding:11px;display:flex;flex-direction:column;gap:8px}
.hd{display:flex;align-items:center;justify-content:space-between;height:30px}
.brand{display:flex;align-items:center;gap:8px}.drop{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#E0887A,#9080BA)}
.brand b{display:block;font-size:14px;font-weight:700;line-height:1.1}.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--d)}
.btns{display:flex;gap:4px}.btns i,.bh .n,.go{display:flex;align-items:center;justify-content:center}.btns i{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.04);color:var(--m)}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.blk{border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.blk.on{background:rgba(255,255,255,.035);border-color:var(--b)}
.bh{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:38px}
.bh .n{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.07);color:var(--m);font-size:11px;font-weight:800}
.blk.on .bh .n{background:var(--c);color:#14090A}
.bh .t{font-size:13.5px;font-weight:700}
.bh .s{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.bh .s.hot{color:var(--c)}.bh .s .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6BA888;margin-right:5px;vertical-align:middle}
.bh .chev{color:var(--d)}.blk.on .bh .chev{transform:rotate(90deg)}
.bb{padding:0 10px 10px;display:none;flex-direction:column;gap:8px}.blk.on .bb{display:flex}
.go{height:38px;border-radius:11px;background:#1D1B2E;color:var(--c);font-size:13.5px;font-weight:800;gap:8px}
.stats{display:flex;gap:6px}.stat{flex:1;border-radius:10px;background:rgba(255,255,255,.03);padding:7px 8px}
.stat b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.stat small{display:block;font-size:10.5px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--d)}
.card{position:absolute;right:18px;top:16px;width:336px;padding:10px 11px;display:flex;align-items:center;gap:9px;border-color:rgba(224,136,122,.28);opacity:0}
.card .av{width:34px;height:34px;border-radius:50%;background:#1a1820 center/cover no-repeat}
.card .tx{flex:1;min-width:0}.card .tx b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap}
.card .tx small{display:block;font-size:11px;color:var(--m);line-height:1.35}
.card .na{display:flex;flex-direction:column;gap:5px}.card .na span{border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);text-align:center}
.card .na .p{background:var(--c);color:#14090A;font-weight:800}
#fade{position:absolute;inset:0;z-index:8;background:#100f14;opacity:0}
#cur{position:absolute;z-index:9;left:0;top:0;width:26px;height:26px;opacity:0;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
#cur svg{width:26px;height:26px;fill:#fff;stroke:#111;stroke-width:1.5}
</style>
</head>
<body>
<div id="cam">
  <div id="grid"><div id="track"></div></div>
  <div id="badge" data-k="badge"></div>
  <div class="card" id="note"><span class="av" id="noteAv"></span><div class="tx"><b id="noteT"></b><small data-k="noteText"></small></div><div class="na"><span class="p" data-k="noteShow"></span><span id="resume" data-k="noteResume"></span></div></div>
  <div id="dock"><div class="panel">
    <div class="hd"><div class="brand"><i class="drop"></i><div><b>Profile Name Search</b><small data-k="byFluidz"></small></div></div>
      <div class="btns"><i><svg class="ic"><use href="/labs/icons.svg#minus"/></svg></i><i><svg class="ic"><use href="/labs/icons.svg#x"/></svg></i></div></div>
    <section class="blk"><div class="bh"><span class="n">1</span><span class="t" data-k="b1"></span><span class="s hot">top | xxl</span><svg class="ic chev"><use href="/labs/icons.svg#chevron-right"/></svg></div></section>
    <section class="blk on"><div class="bh"><span class="n">2</span><span class="t" data-k="b2"></span><span class="s hot" id="s2"></span><svg class="ic chev"><use href="/labs/icons.svg#chevron-right"/></svg></div>
      <div class="bb"><div class="go"><svg class="ic"><use href="/labs/icons.svg#pause"/></svg><span data-k="pause"></span></div>
        <div class="stats"><div class="stat"><b id="g1" style="color:#6BA888">0</b><small data-k="gScanned"></small></div><div class="stat"><b id="g2" style="color:#E0887A">0</b><small data-k="gFound"></small></div><div class="stat"><b id="g3" style="color:#9080BA">0</b><small data-k="gFav"></small></div></div>
        <div class="meta" id="meta"></div></div></section>
    <section class="blk"><div class="bh"><span class="n">3</span><span class="t" data-k="b3"></span><span class="s" id="s3"></span><svg class="ic chev"><use href="/labs/icons.svg#chevron-right"/></svg></div></section>
  </div></div>
  <div id="fade"></div>
  <div id="cur"><svg viewBox="0 0 24 24"><path d="M4 3l16 7-7 2-3 7z"/></svg></div>
</div>
<script>
