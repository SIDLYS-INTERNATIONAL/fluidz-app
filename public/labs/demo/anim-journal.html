/* Scan journal, 10 s loop. Colours and layout from pns-demo.html; 800x600, scaled to fit. */
:root{--m:rgba(237,232,245,.56);--d:rgba(237,232,245,.32);--b:rgba(255,255,255,.09);--c:#E0887A;--g:#6BA888}

.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.vw{position:absolute;left:22px;right:22px;top:66px;display:flex;flex-direction:column;gap:10px}
.oh{display:flex;align-items:center;gap:12px;height:42px}.oh .back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--m)}.oh b{flex:1;font-size:22px;font-weight:700}
.lk{border-radius:999px;padding:0 16px;height:38px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;background:rgba(255,255,255,.06);color:#EDE8F5}
.hint{font-size:15px;color:var(--m)}
.jr{display:flex;align-items:center;gap:14px;border:1px solid var(--b);border-radius:14px;padding:11px 14px;background:rgba(255,255,255,.025)}
.jr.on{border-color:rgba(224,136,122,.3)}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:17px;font-weight:700;white-space:nowrap}.tx small{display:block;font-size:13px;color:var(--m);white-space:nowrap;line-height:1.4}
.avs{display:flex}.avs .av{border:2px solid #0d0c16;width:30px;height:30px}.avs .av+.av{margin-left:-9px}
.av{width:32px;height:32px;border-radius:50%;background:#1a1820 center/cover no-repeat}
.pill{font-size:11px;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.07);color:var(--m)}
.pill.full{background:rgba(107,168,136,.16);color:var(--g)}.pill.time{background:rgba(227,178,90,.16);color:#E3B25A}
#rl{display:flex;flex-direction:column;gap:5px;overflow:hidden;height:0}
.r{display:flex;align-items:center;gap:10px;border-radius:12px;padding:7px 9px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.r.on{background:rgba(224,136,122,.12);border-color:rgba(224,136,122,.28)}

.ok.sh{width:32px;padding:0;background:rgba(107,168,136,.18);color:var(--g)}

.cnt{display:flex;gap:8px}.cnt div{flex:1;border-radius:12px;background:rgba(255,255,255,.03);padding:13px 14px}
